[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "armut-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for armut.com local services (search, pros, FAQs, price guides)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
armut-mcp = "armut_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/armut_mcp"]
